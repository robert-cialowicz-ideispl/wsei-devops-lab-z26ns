events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://backend:8080/health;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
        }
    }
}
